name: 核验矩阵乘法指数的 Lean 证明

on:
  push:
    paths:
      - 'lean/**'
      - '.github/workflows/verify-lean.yml'
  workflow_dispatch:

# 作业只读取仓库内容，构建结果显示在 Actions 日志中。
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: 为 Lean、完整 mathlib 缓存和证明编译产物腾出空间
        shell: bash
        run: |
          df -h /
          # 只清理一次性 GitHub 托管虚拟机中与 Lean 无关的预装 SDK。
          sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet /usr/local/.ghcup /opt/ghc
          df -h /

      - name: 检出本次提交
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: 核对全部证明源文件及导入依赖
        run: python3 lean/tools/verify-source.py

      - name: 安装固定版本的 Lean 并获取 mathlib 缓存
        uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee # v1
        env:
          # 空值令此版本的 lean-action 保留 mathlib 客户端内建的官方缓存源顺序。
          MATHLIB_CACHE_GET_URL: ''
          # 下载文件与已展开的依赖分开，便于在编译本地模块前释放压缩包占用的空间。
          MATHLIB_CACHE_DIR: ${{ runner.temp }}/mathlib-downloads
        with:
          lake-package-directory: lean
          auto-config: 'false'
          build: 'false'
          use-mathlib-cache: 'true'
          use-github-cache: 'false'

      - name: 释放已解压的下载包
        shell: bash
        run: |
          downloads="$RUNNER_TEMP/mathlib-downloads"
          if [[ -d "$downloads" ]]; then
            find "$downloads" -type f -name '*.ltar' -delete
          fi
          df -h /

      - name: 恢复上游 592 个证明模块的构建缓存
        id: oai-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: lean/.lake/build
          key: oai-base-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean/lean-toolchain', 'lean/lake-manifest.json', 'lean/OAI/**/*.lean') }}

      - name: 构建上游证明入口
        working-directory: lean
        env:
          LEAN_NUM_THREADS: '3'
        run: lake build +OAI.LinearAlgebra.SpectralBooks.ExactExponent

      - name: 保存上游证明缓存供后续扩展核验使用
        if: steps.oai-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: lean/.lake/build
          key: ${{ steps.oai-cache.outputs.cache-primary-key }}

      - name: 构建证明并检查三个定理允许使用的公理
        env:
          # 标准公开 Linux 运行器有四个 CPU、16 GB 内存，为 Lean 的任务池预留内存余量。
          LEAN_NUM_THREADS: '3'
        run: sh lean/verify-lean.sh
